
name: Gerar APK Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar cache
        run: mkdir -p "$HOME/.buildozer"
        
      - name: Compilar aplicativo
        run: |
          docker pull ghcr.io/kivy/buildozer:latest
          docker run --rm \
            -w /home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            -v "$GITHUB_WORKSPACE":/home/user/hostcwd \
            ghcr.io/kivy/buildozer:latest android debug
            
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-horas-apk
          path: bin/*.apk
          if-no-files-found: error
